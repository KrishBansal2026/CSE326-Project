<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 300 300">
  <defs>
    <filter id="leather-texture" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="4" result="noise" />
      <feColorMatrix type="matrix" values="0.33 0.33 0.33 0 0  0.33 0.33 0.33 0 0  0.33 0.33 0.33 0 0  0 0 0 0.18 0" in="noise" result="coloredNoise"/>
      <feBlend mode="multiply" in="SourceGraphic" in2="coloredNoise" />
    </filter>
    <pattern id="grainPattern" width="60" height="60" patternUnits="userSpaceOnUse">
      <rect width="60" height="60" fill="none"/>
      <circle cx="12" cy="18" r="1.2" fill="#000" opacity="0.08"/>
      <circle cx="34" cy="42" r="1.4" fill="#000" opacity="0.06"/>
      <circle cx="48" cy="15" r="1" fill="#fff" opacity="0.07"/>
      <circle cx="22" cy="50" r="1.3" fill="#000" opacity="0.09"/>
      <path d="M5,12 Q15,10 25,14" stroke="#000" stroke-width="0.5" stroke-opacity="0.07" fill="none"/>
      <path d="M30,35 Q40,32 52,38" stroke="#000" stroke-width="0.5" stroke-opacity="0.06" fill="none"/>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="transparent" />
  <rect width="100%" height="100%" fill="url(#grainPattern)" />
</svg>