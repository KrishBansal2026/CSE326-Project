<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="stamp-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#261b15" />
      <stop offset="100%" stop-color="#120c09" />
    </linearGradient>
    <linearGradient id="gold-leaf-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff5cc" />
      <stop offset="30%" stop-color="#ffd700" />
      <stop offset="70%" stop-color="#d4af37" />
      <stop offset="100%" stop-color="#996515" />
    </linearGradient>
    <linearGradient id="brass-block" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f5dfa2" />
      <stop offset="50%" stop-color="#caa45a" />
      <stop offset="100%" stop-color="#694d1b" />
    </linearGradient>
    <filter id="gold-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="600" height="450" fill="url(#stamp-bg)" />

  <!-- Atelier Worktable Surface -->
  <rect x="40" y="220" width="520" height="170" rx="4" fill="#1e140f" stroke="#332117" stroke-width="2" />

  <!-- Leather Panel on Stamping Bed -->
  <rect x="120" y="240" width="360" height="130" rx="6" fill="#35241d" stroke="#20140f" stroke-width="2" filter="drop-shadow(0 8px 16px rgba(0,0,0,0.5))" />
  <rect x="128" y="248" width="344" height="114" rx="4" fill="none" stroke="#683416" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.6" />

  <!-- Continuous 22k Gold Foil Leaf Ribbon crossing the panel -->
  <path d="M 60 290 Q 240 275 360 295 T 540 285" fill="none" stroke="url(#gold-leaf-grad)" stroke-width="48" opacity="0.9" filter="url(#gold-glow)" />

  <!-- Heavy Heated Brass Type Chase / Handset Typehead -->
  <g transform="translate(250, 110)" filter="drop-shadow(4px 14px 20px rgba(0,0,0,0.7))">
    <!-- Steel Ram / Hydraulic Pressure Shaft -->
    <rect x="35" y="-90" width="30" height="110" fill="#4a5056" stroke="#222" stroke-width="2" />
    <!-- Heating Block Element -->
    <rect x="0" y="10" width="100" height="45" rx="4" fill="url(#brass-block)" stroke="#3e2e11" stroke-width="2" />
    <!-- Brass Foundry Type Inserts (Engraved letters 'AH') -->
    <rect x="15" y="55" width="32" height="42" rx="2" fill="url(#brass-block)" stroke="#3e2e11" stroke-width="1.5" />
    <text x="31" y="86" font-family="'Cormorant Garamond', Georgia, serif" font-size="30" font-weight="bold" text-anchor="middle" fill="#1c1208">A</text>

    <rect x="53" y="55" width="32" height="42" rx="2" fill="url(#brass-block)" stroke="#3e2e11" stroke-width="1.5" />
    <text x="69" y="86" font-family="'Cormorant Garamond', Georgia, serif" font-size="30" font-weight="bold" text-anchor="middle" fill="#1c1208">H</text>
  </g>

  <!-- Thermostatic Heat Indicator Light -->
  <g transform="translate(480, 160)">
    <circle cx="0" cy="0" r="16" fill="#140d0a" stroke="#caa45a" stroke-width="1.5" />
    <circle cx="0" cy="0" r="7" fill="#e8612c" filter="drop-shadow(0 0 6px #ff5722)" />
    <text x="24" y="4" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10" fill="#dfcaa7" letter-spacing="1">110°C CALIBRATED</text>
  </g>

  <!-- Freshly Debossed Gold Foil Impressions -->
  <g transform="translate(200, 310)">
    <text x="0" y="0" font-family="'Cormorant Garamond', Georgia, serif" font-size="28" font-weight="bold" fill="url(#gold-leaf-grad)" letter-spacing="4" filter="drop-shadow(0 1px 2px #0a0503)">ATELIER HIDE</text>
  </g>

  <!-- Editorial Caption -->
  <g transform="translate(60, 420)" opacity="0.65">
    <text x="0" y="0" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10" fill="#dfd6cb" letter-spacing="2">STAGE 05 — 110°C HEATED BRASS FOUNDRY TYPE &amp; 22K METALLIC GOLD FOIL</text>
  </g>
</svg>
