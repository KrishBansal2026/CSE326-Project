<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 800" width="100%" height="100%">
  <defs>
    <linearGradient id="philosophy-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2c1e18" />
      <stop offset="50%" stop-color="#1d130e" />
      <stop offset="100%" stop-color="#110a07" />
    </linearGradient>
    <linearGradient id="leather-corner" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bd9367" />
      <stop offset="50%" stop-color="#8c6136" />
      <stop offset="100%" stop-color="#5a381b" />
    </linearGradient>
  </defs>
  <rect width="700" height="800" fill="url(#philosophy-bg)" />
  <!-- Editorial composition with layered leather hide, brass compass, and vintage blueprint lines -->
  <g opacity="0.1" stroke="#fff" stroke-width="0.8">
    <circle cx="350" cy="400" r="280" fill="none" />
    <circle cx="350" cy="400" r="200" fill="none" stroke-dasharray="4 4" />
    <line x1="350" y1="40" x2="350" y2="760" />
    <line x1="70" y1="400" x2="630" y2="400" />
  </g>
  <!-- Curving thick Tuscan hide drape -->
  <path d="M 120 700 Q 220 300 580 220 L 620 540 Q 340 580 180 720 Z" fill="url(#leather-corner)" opacity="0.85" filter="drop-shadow(10px 20px 25px rgba(0,0,0,0.7))" />
  <path d="M 130 690 Q 225 310 570 232" fill="none" stroke="#f4efe6" stroke-width="2.5" stroke-dasharray="7 5" opacity="0.6" />
  <!-- Stamped atelier wax seal -->
  <g transform="translate(380, 480)">
    <circle cx="0" cy="0" r="65" fill="#5c1a14" stroke="#380d09" stroke-width="3" filter="drop-shadow(4px 8px 12px rgba(0,0,0,0.6))" />
    <circle cx="0" cy="0" r="54" fill="none" stroke="#d49a88" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.7" />
    <text x="0" y="-8" font-family="'Cormorant Garamond', Georgia, serif" font-size="22" font-weight="bold" text-anchor="middle" fill="#ebd6cf" letter-spacing="3">ATELIER</text>
    <text x="0" y="16" font-family="'Cormorant Garamond', Georgia, serif" font-size="22" font-weight="bold" text-anchor="middle" fill="#ebd6cf" letter-spacing="4">HIDE</text>
    <text x="0" y="34" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="7" text-anchor="middle" fill="#ebd6cf" letter-spacing="2">EST. 2024</text>
  </g>
  <!-- Editorial Typographic Inscription -->
  <g transform="translate(80, 140)">
    <text x="0" y="0" font-family="'Cormorant Garamond', Georgia, serif" font-size="32" font-style="italic" fill="#ead8c3">"Materials that remember."</text>
    <text x="0" y="32" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="9" fill="#a49382" letter-spacing="3">THE PRINCIPLE OF NATURAL PATINA</text>
  </g>
</svg>