<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 650" width="100%" height="100%" id="svg-messenger">
  <defs>
    <linearGradient id="msg-leather-grad" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="var(--leather-base-light, #c99f74)" />
      <stop offset="60%" stop-color="var(--leather-base-mid, #bd9367)" />
      <stop offset="100%" stop-color="var(--leather-base-dark, #8f653b)" />
    </linearGradient>

    <linearGradient id="msg-flap-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="var(--leather-base-light, #c99f74)" />
      <stop offset="85%" stop-color="var(--leather-base-mid, #bd9367)" />
      <stop offset="100%" stop-color="var(--leather-base-dark, #8f653b)" />
    </linearGradient>

    <linearGradient id="msg-strap-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="var(--leather-base-dark, #78532d)" />
      <stop offset="50%" stop-color="var(--leather-base-mid, #bd9367)" />
      <stop offset="100%" stop-color="var(--leather-base-dark, #78532d)" />
    </linearGradient>

    <filter id="msg-shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="28" stdDeviation="24" flood-color="#140d0a" flood-opacity="0.34" />
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#140d0a" flood-opacity="0.22" />
    </filter>

    <filter id="flap-drop" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#120c08" flood-opacity="0.45" />
    </filter>

    <linearGradient id="msg-hw-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="var(--hw-light, #e4cb93)" />
      <stop offset="45%" stop-color="var(--hw-mid, #a88952)" />
      <stop offset="100%" stop-color="var(--hw-dark, #5d461e)" />
    </linearGradient>
  </defs>

  <!-- Ground Shadow -->
  <ellipse cx="400" cy="580" rx="340" ry="42" fill="#0d0806" opacity="0.32" filter="blur(18px)" />

  <g filter="url(#msg-shadow)">
    <!-- Top Carry Handle Base & Arch -->
    <path d="M 330 145 C 330 75, 470 75, 470 145" fill="none" stroke="url(#msg-strap-grad)" stroke-width="26" stroke-linecap="round" />
    <path d="M 330 145 C 330 75, 470 75, 470 145" fill="none" stroke="var(--stitch-color, #e0d0b8)" stroke-width="1.8" stroke-dasharray="6 4" stroke-linecap="round" />
    <!-- Handle Anchors -->
    <rect x="312" y="130" width="36" height="32" rx="6" fill="url(#msg-strap-grad)" stroke="var(--leather-base-dark, #78532d)" stroke-width="1.5" />
    <rect x="452" y="130" width="36" height="32" rx="6" fill="url(#msg-strap-grad)" stroke="var(--leather-base-dark, #78532d)" stroke-width="1.5" />
    <circle cx="330" cy="146" r="5" fill="url(#msg-hw-grad)" stroke="#22140b" stroke-width="1" />
    <circle cx="470" cy="146" r="5" fill="url(#msg-hw-grad)" stroke="#22140b" stroke-width="1" />

    <!-- Side D-Rings for Shoulder Strap -->
    <path d="M 125 240 C 105 240 105 290 125 290" fill="none" stroke="url(#msg-hw-grad)" stroke-width="8" stroke-linecap="round" />
    <path d="M 675 240 C 695 240 695 290 675 290" fill="none" stroke="url(#msg-hw-grad)" stroke-width="8" stroke-linecap="round" />

    <!-- Main Bag Body / Gusset Behind -->
    <rect x="120" y="140" width="560" height="390" rx="20" fill="url(#msg-leather-grad)" stroke="var(--leather-base-dark, #78532d)" stroke-width="2" />
    <rect x="128" y="148" width="544" height="374" rx="14" fill="none" stroke="var(--stitch-color, #e0d0b8)" stroke-width="2" stroke-dasharray="7 5" />

    <!-- Main Flap Over Body -->
    <g filter="url(#flap-drop)">
      <path d="M 116 140 L 684 140 C 684 140 684 370 684 380 Q 684 410 650 410 L 150 410 Q 116 410 116 380 Z" fill="url(#msg-flap-grad)" stroke="var(--leather-base-dark, #78532d)" stroke-width="2.5" />
      <!-- Flap Perimeter Stitching -->
      <path d="M 126 148 L 674 148 C 674 148 674 365 674 375 Q 674 400 644 400 L 156 400 Q 126 400 126 375 Z" fill="none" stroke="var(--stitch-color, #e0d0b8)" stroke-width="2.2" stroke-dasharray="7 5" />
    </g>

    <!-- Vertical Closure Straps with Solid Hardware Buckles -->
    <!-- Left Strap -->
    <g>
      <rect x="230" y="140" width="42" height="350" rx="4" fill="url(#msg-strap-grad)" stroke="var(--leather-base-dark, #78532d)" stroke-width="1.5" />
      <line x1="236" y1="140" x2="236" y2="480" stroke="var(--stitch-color, #e0d0b8)" stroke-width="1.8" stroke-dasharray="6 4" />
      <line x1="266" y1="140" x2="266" y2="480" stroke="var(--stitch-color, #e0d0b8)" stroke-width="1.8" stroke-dasharray="6 4" />
      <!-- Buckle Base Frame -->
      <rect x="220" y="380" width="62" height="48" rx="6" fill="url(#msg-hw-grad)" stroke="#2a1a0e" stroke-width="2" />
      <rect x="230" y="390" width="42" height="28" rx="3" fill="#18110b" />
      <!-- Buckle Tongue/Prong -->
      <rect x="248" y="375" width="6" height="56" rx="2" fill="url(#msg-hw-grad)" stroke="#2a1a0e" stroke-width="1" />
      <!-- Hardware Stud Rivets -->
      <circle cx="251" cy="455" r="5" fill="url(#msg-hw-grad)" stroke="#2a1a0e" stroke-width="1" />
    </g>

    <!-- Right Strap -->
    <g>
      <rect x="528" y="140" width="42" height="350" rx="4" fill="url(#msg-strap-grad)" stroke="var(--leather-base-dark, #78532d)" stroke-width="1.5" />
      <line x1="534" y1="140" x2="534" y2="480" stroke="var(--stitch-color, #e0d0b8)" stroke-width="1.8" stroke-dasharray="6 4" />
      <line x1="564" y1="140" x2="564" y2="480" stroke="var(--stitch-color, #e0d0b8)" stroke-width="1.8" stroke-dasharray="6 4" />
      <!-- Buckle Base Frame -->
      <rect x="518" y="380" width="62" height="48" rx="6" fill="url(#msg-hw-grad)" stroke="#2a1a0e" stroke-width="2" />
      <rect x="528" y="390" width="42" height="28" rx="3" fill="#18110b" />
      <!-- Buckle Tongue/Prong -->
      <rect x="546" y="375" width="6" height="56" rx="2" fill="url(#msg-hw-grad)" stroke="#2a1a0e" stroke-width="1" />
      <!-- Hardware Stud Rivets -->
      <circle cx="549" cy="455" r="5" fill="url(#msg-hw-grad)" stroke="#2a1a0e" stroke-width="1" />
    </g>

    <!-- Monogram Target Spot (Center-bottom of the Flap between straps) -->
    <g id="svg-monogram-target" transform="translate(400, 360)">
      <!-- Positioned right on the lower mid flap -->
    </g>
  </g>
</svg>