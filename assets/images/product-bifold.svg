<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 650" width="100%" height="100%" id="svg-bifold">
  <defs>
    <!-- Dynamic Leather Gradient -->
    <linearGradient id="bifold-leather-grad" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="var(--leather-base-light, #c99f74)" />
      <stop offset="50%" stop-color="var(--leather-base-mid, #bd9367)" />
      <stop offset="100%" stop-color="var(--leather-base-dark, #8f653b)" />
    </linearGradient>

    <linearGradient id="bifold-crease-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#000" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#fff" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#000" stop-opacity="0.4" />
    </linearGradient>

    <!-- Drop Shadow for Leather Elevation -->
    <filter id="leather-shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="24" stdDeviation="22" flood-color="#140d0a" flood-opacity="0.32" />
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#140d0a" flood-opacity="0.2" />
    </filter>

    <!-- Hardware Gradient -->
    <linearGradient id="hardware-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="var(--hw-light, #e4cb93)" />
      <stop offset="45%" stop-color="var(--hw-mid, #a88952)" />
      <stop offset="100%" stop-color="var(--hw-dark, #5d461e)" />
    </linearGradient>
  </defs>

  <!-- Background Ambience & Ground Shadow -->
  <ellipse cx="400" cy="560" rx="310" ry="40" fill="#0c0705" opacity="0.28" filter="blur(16px)" />

  <!-- Outer Leather Shell with Shadow -->
  <g filter="url(#leather-shadow)">
    <!-- Main Folded Bifold Body -->
    <rect id="bifold-body" x="140" y="110" width="520" height="420" rx="28" ry="28" fill="url(#bifold-leather-grad)" stroke="var(--leather-base-dark, #78532d)" stroke-width="2" />

    <!-- Spine fold highlight / crease -->
    <rect x="390" y="110" width="20" height="420" fill="url(#bifold-crease-grad)" opacity="0.35" />
    <line x1="399" y1="110" x2="399" y2="530" stroke="#000" stroke-opacity="0.25" stroke-width="2" />
    <line x1="401" y1="110" x2="401" y2="530" stroke="#fff" stroke-opacity="0.15" stroke-width="1.5" />

    <!-- Burnished Beveled Edge Border -->
    <rect x="144" y="114" width="512" height="412" rx="24" ry="24" fill="none" stroke="#2a1a12" stroke-width="1.8" stroke-opacity="0.6" />

    <!-- Traditional Saddle Stitching (Perimeter) -->
    <rect x="154" y="124" width="492" height="392" rx="20" ry="20" fill="none" stroke="var(--stitch-color, #e0d0b8)" stroke-width="2.2" stroke-dasharray="7 5" stroke-linecap="round" opacity="0.85" />

    <!-- Front Exterior Card Slot Arc Detail -->
    <path d="M 460 210 Q 560 230 648 210" fill="none" stroke="var(--leather-base-dark, #78532d)" stroke-width="3" opacity="0.8" />
    <path d="M 460 212 Q 560 232 648 212" fill="none" stroke="#fff" stroke-width="1" opacity="0.25" />
    <path d="M 466 222 Q 560 240 642 222" fill="none" stroke="var(--stitch-color, #e0d0b8)" stroke-width="2" stroke-dasharray="6 4" stroke-linecap="round" opacity="0.75" />

    <!-- Atelier Hide Maker's Mark (Subtle Blind Debossed Brand Logo) -->
    <g transform="translate(230, 445)" opacity="0.38">
      <circle cx="20" cy="20" r="16" fill="none" stroke="#000" stroke-width="1.5" />
      <text x="20" y="24" font-family="'Cormorant Garamond', Georgia, serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#000" letter-spacing="1">AH</text>
    </g>

    <!-- Solid Hardware Accent Rivet (Corner Reinforcement) -->
    <g transform="translate(170, 140)">
      <circle cx="0" cy="0" r="7" fill="url(#hardware-grad)" stroke="#2b1a0d" stroke-width="1" />
      <circle cx="0" cy="0" r="4.5" fill="none" stroke="#fff" stroke-opacity="0.4" stroke-width="0.8" />
      <circle cx="-1.5" cy="-1.5" r="1.5" fill="#fff" opacity="0.6" />
    </g>
    <g transform="translate(630, 140)">
      <circle cx="0" cy="0" r="7" fill="url(#hardware-grad)" stroke="#2b1a0d" stroke-width="1" />
      <circle cx="0" cy="0" r="4.5" fill="none" stroke="#fff" stroke-opacity="0.4" stroke-width="0.8" />
      <circle cx="-1.5" cy="-1.5" r="1.5" fill="#fff" opacity="0.6" />
    </g>

    <!-- Monogram Zone (Interactive Stamping Plate Area) -->
    <!-- The HTML/JS will project custom monogram right here or directly overlay -->
    <g id="svg-monogram-target" transform="translate(560, 455)">
      <!-- Target Area Frame for visual alignment -->
    </g>
  </g>
</svg>