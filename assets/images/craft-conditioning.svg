<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="cond-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#231813" />
      <stop offset="100%" stop-color="#110b08" />
    </linearGradient>
    <linearGradient id="amber-jar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bf7546" />
      <stop offset="50%" stop-color="#8c471d" />
      <stop offset="100%" stop-color="#4e230b" />
    </linearGradient>
    <linearGradient id="brush-wood" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8a532f" />
      <stop offset="50%" stop-color="#b67a4d" />
      <stop offset="100%" stop-color="#67391a" />
    </linearGradient>
  </defs>
  <rect width="600" height="450" fill="url(#cond-bg)" />

  <!-- Inspection Workstation Table -->
  <rect x="50" y="240" width="500" height="150" rx="4" fill="#1b120d" stroke="#2e1d15" stroke-width="2" />

  <!-- Polished Finished Leather Goods (Passport Companion / Card Wallet) -->
  <rect x="220" y="160" width="220" height="160" rx="14" fill="#a9673f" stroke="#683416" stroke-width="2" filter="drop-shadow(0 14px 24px rgba(0,0,0,0.65))" />
  <!-- Glossy Conditioned Patina Highlight Sheen -->
  <path d="M 230 170 Q 330 190 430 170 L 430 240 Q 330 260 230 240 Z" fill="#fff" opacity="0.08" />
  <rect x="232" y="172" width="196" height="136" rx="10" fill="none" stroke="#f4efe6" stroke-width="2" stroke-dasharray="6 4" opacity="0.85" />
  <!-- Blind Stamped Crest on piece -->
  <circle cx="330" cy="240" r="16" fill="none" stroke="#4a210a" stroke-width="1.5" />
  <text x="330" y="245" font-family="'Cormorant Garamond', Georgia, serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#4a210a" letter-spacing="1">AH</text>

  <!-- Heavy Amber Apothecary Balm Jar -->
  <g transform="translate(130, 230)" filter="drop-shadow(4px 10px 14px rgba(0,0,0,0.6))">
    <!-- Glass Jar Body -->
    <rect x="-35" y="-10" width="70" height="75" rx="8" fill="url(#amber-jar)" stroke="#2b1307" stroke-width="2" />
    <!-- Cream Balm Inside / Label -->
    <rect x="-28" y="10" width="56" height="40" rx="3" fill="#f5ede0" stroke="#d5c7b3" stroke-width="1" />
    <text x="0" y="26" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="7" font-weight="bold" fill="#35241d" text-anchor="middle" letter-spacing="1">ATELIER BALM</text>
    <text x="0" y="38" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="6" fill="#887766" text-anchor="middle">JOJOBA &amp; BEESWAX</text>
    <!-- Black Bakelite Lid -->
    <rect x="-38" y="-22" width="76" height="16" rx="3" fill="#1c1917" stroke="#333" stroke-width="1.5" />
    <line x1="-34" y1="-14" x2="34" y2="-14" stroke="#fff" opacity="0.15" />
  </g>

  <!-- Dense Horsehair Buffing Brush -->
  <g transform="translate(470, 260) rotate(-18)" filter="drop-shadow(6px 12px 16px rgba(0,0,0,0.65))">
    <!-- Solid Pearwood Handle -->
    <path d="M -50 -15 C -40 -30, 40 -30, 50 -15 L 45 5 L -45 5 Z" fill="url(#brush-wood)" stroke="#381c0c" stroke-width="1.5" />
    <!-- Fine Natural Horsehair Bristles -->
    <rect x="-44" y="5" width="88" height="42" fill="#1f1814" stroke="#0d0907" stroke-width="1" />
    <!-- Bristle Texture Lines -->
    <line x1="-30" y1="5" x2="-30" y2="47" stroke="#3a3028" stroke-width="1.5" />
    <line x1="-15" y1="5" x2="-15" y2="47" stroke="#3a3028" stroke-width="1.5" />
    <line x1="0" y1="5" x2="0" y2="47" stroke="#3a3028" stroke-width="1.5" />
    <line x1="15" y1="5" x2="15" y2="47" stroke="#3a3028" stroke-width="1.5" />
    <line x1="30" y1="5" x2="30" y2="47" stroke="#3a3028" stroke-width="1.5" />
  </g>

  <!-- Inspection Magnifying Loupe on Stand -->
  <g transform="translate(290, 90)">
    <circle cx="0" cy="0" r="38" fill="none" stroke="#caa45a" stroke-width="4" filter="drop-shadow(0 4px 10px rgba(0,0,0,0.5))" />
    <circle cx="0" cy="0" r="35" fill="#fff" opacity="0.05" />
    <!-- Handle -->
    <line x1="26" y1="26" x2="65" y2="65" stroke="#caa45a" stroke-width="6" stroke-linecap="round" />
    <circle cx="-12" cy="-12" r="5" fill="#fff" opacity="0.3" filter="blur(1px)" />
  </g>

  <!-- Stage Caption -->
  <g transform="translate(60, 420)" opacity="0.65">
    <text x="0" y="0" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10" fill="#dfd6cb" letter-spacing="2">STAGE 06 — BENCH MAGNIFICATION INSPECTION &amp; ORGANIC BALM POLISHING</text>
  </g>
</svg>
