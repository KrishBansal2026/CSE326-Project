<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="100%" height="100%">
  <defs>
    <!-- Cinematic Luxury Studio Ambient Lighting Backdrop -->
    <radialGradient id="hero-ambience" cx="50%" cy="45%" r="75%">
      <stop offset="0%" stop-color="#3d2a21" />
      <stop offset="55%" stop-color="#231712" />
      <stop offset="100%" stop-color="#120c08" />
    </radialGradient>

    <!-- Rich Heritage Cognac Vegetable-Tanned Steerhide Gradient -->
    <linearGradient id="hero-leather-grad" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#d4a373" />
      <stop offset="35%" stop-color="#b67a49" />
      <stop offset="70%" stop-color="#8c4e25" />
      <stop offset="100%" stop-color="#4e250f" />
    </linearGradient>

    <linearGradient id="hero-flap-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d4a373" />
      <stop offset="65%" stop-color="#a4693a" />
      <stop offset="100%" stop-color="#6e3717" />
    </linearGradient>

    <linearGradient id="hero-strap-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6e3717" />
      <stop offset="50%" stop-color="#a4693a" />
      <stop offset="100%" stop-color="#55260c" />
    </linearGradient>

    <!-- Solid Sand-Cast Antique Brass Hardware Gradient -->
    <linearGradient id="hero-brass-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#faecc5" />
      <stop offset="40%" stop-color="#d4a853" />
      <stop offset="75%" stop-color="#9a752b" />
      <stop offset="100%" stop-color="#5a4218" />
    </linearGradient>

    <!-- 22k Gold Foil Metallic Gradient for Hot-Stamped Monogram -->
    <linearGradient id="hero-gold-foil" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff5db" />
      <stop offset="30%" stop-color="#fad068" />
      <stop offset="70%" stop-color="#d49e2e" />
      <stop offset="100%" stop-color="#8f6412" />
    </linearGradient>

    <!-- Soft Depth and Contact Drop Shadows -->
    <filter id="hero-bag-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="48" stdDeviation="40" flood-color="#050302" flood-opacity="0.72" />
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#050302" flood-opacity="0.45" />
    </filter>

    <filter id="hero-flap-drop" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#0d0805" flood-opacity="0.55" />
    </filter>
  </defs>

  <!-- Ambient Luxury Backdrop -->
  <rect width="1200" height="900" fill="url(#hero-ambience)" />

  <!-- Subtle Studio Pedestal Contact Shadow -->
  <ellipse cx="600" cy="740" rx="460" ry="70" fill="#040201" opacity="0.65" filter="blur(32px)" />

  <!-- Architectural Background Grid Accents -->
  <line x1="180" y1="0" x2="180" y2="900" stroke="#fff" stroke-opacity="0.02" stroke-width="1" />
  <line x1="1020" y1="0" x2="1020" y2="900" stroke="#fff" stroke-opacity="0.02" stroke-width="1" />

  <!-- The Structured Luxury Handbag Piece -->
  <g transform="translate(230, 40)" filter="url(#hero-bag-shadow)">
    <!-- Back Handle Arch -->
    <path d="M 285 240 C 285 70, 515 70, 515 240" fill="none" stroke="url(#hero-strap-grad)" stroke-width="26" stroke-linecap="round" opacity="0.75" />

    <!-- Protective Base Brass Studs -->
    <g transform="translate(0, 642)">
      <circle cx="180" cy="0" r="9" fill="url(#hero-brass-grad)" stroke="#1a110a" stroke-width="2" />
      <circle cx="620" cy="0" r="9" fill="url(#hero-brass-grad)" stroke="#1a110a" stroke-width="2" />
      <circle cx="320" cy="2" r="8" fill="url(#hero-brass-grad)" stroke="#1a110a" stroke-width="1.5" />
      <circle cx="480" cy="2" r="8" fill="url(#hero-brass-grad)" stroke="#1a110a" stroke-width="1.5" />
    </g>

    <!-- Side D-Rings (For Detachable Shoulder Strap) -->
    <path d="M 125 380 C 95 380 95 440 125 440" fill="none" stroke="url(#hero-brass-grad)" stroke-width="8" stroke-linecap="round" />
    <path d="M 675 380 C 705 380 705 440 675 440" fill="none" stroke="url(#hero-brass-grad)" stroke-width="8" stroke-linecap="round" />

    <!-- Main Handbag Structured Trapezoidal Body -->
    <path d="M 120 600 L 175 240 Q 180 225 195 225 L 605 225 Q 620 225 625 240 L 680 600 Q 685 640 640 640 L 160 640 Q 115 640 120 600 Z" fill="url(#hero-leather-grad)" stroke="#4e250f" stroke-width="3" />

    <!-- Side Inward Gusset Shadow Creases -->
    <path d="M 175 240 Q 210 420 185 630" fill="none" stroke="#361708" stroke-width="4" opacity="0.4" />
    <path d="M 625 240 Q 590 420 615 630" fill="none" stroke="#361708" stroke-width="4" opacity="0.4" />

    <!-- Base Welt Piping -->
    <path d="M 122 622 Q 400 632 678 622" fill="none" stroke="#3a190a" stroke-width="4" opacity="0.8" />
    <path d="M 135 628 L 665 628" fill="none" stroke="#f0ddc3" stroke-width="2.2" stroke-dasharray="7 5" opacity="0.85" />

    <!-- Body Perimeter Saddle Stitching -->
    <path d="M 135 595 L 185 245 L 615 245 L 665 595 Q 668 628 632 628 L 168 628 Q 132 628 135 595 Z" fill="none" stroke="#f0ddc3" stroke-width="2.6" stroke-dasharray="8 6" stroke-linecap="round" opacity="0.85" />

    <!-- Front Sculpted Flap with Curved Tongue -->
    <g filter="url(#hero-flap-drop)">
      <path d="M 180 225 L 620 225 L 608 380 Q 600 460 510 460 L 290 460 Q 200 460 192 380 Z" fill="url(#hero-flap-grad)" stroke="#4e250f" stroke-width="2.5" />
      <!-- Flap Saddle Stitching -->
      <path d="M 194 235 L 606 235 L 595 378 Q 588 448 502 448 L 298 448 Q 212 448 205 378 Z" fill="none" stroke="#f0ddc3" stroke-width="2.4" stroke-dasharray="7 5" stroke-linecap="round" opacity="0.9" />
    </g>

    <!-- Solid Sand-Cast Brass Turn-Lock Clasp Mechanism -->
    <g transform="translate(400, 415)">
      <!-- Escutcheon Plate -->
      <rect x="-48" y="-28" width="96" height="56" rx="14" fill="url(#hero-brass-grad)" stroke="#1a110a" stroke-width="2.5" />
      <rect x="-42" y="-22" width="84" height="44" rx="10" fill="none" stroke="#fff" stroke-opacity="0.3" stroke-width="1.2" />

      <!-- 4 Corner Micro-Rivets -->
      <circle cx="-35" cy="-15" r="3" fill="#24160d" />
      <circle cx="35" cy="-15" r="3" fill="#24160d" />
      <circle cx="-35" cy="15" r="3" fill="#24160d" />
      <circle cx="35" cy="15" r="3" fill="#24160d" />

      <!-- Center Lock Ring -->
      <ellipse cx="0" cy="0" rx="22" ry="17" fill="#140d08" stroke="url(#hero-brass-grad)" stroke-width="2.5" />

      <!-- Rotary Turn-Lock Key -->
      <rect x="-22" y="-7" width="44" height="14" rx="5" fill="url(#hero-brass-grad)" stroke="#1a110a" stroke-width="2" />
      <circle cx="0" cy="0" r="4" fill="#fff" opacity="0.45" />
    </g>

    <!-- Handle Anchors & D-Rings (Front) -->
    <!-- Left Anchor Root -->
    <g transform="translate(280, 205)">
      <rect x="-20" y="0" width="40" height="58" rx="8" fill="url(#hero-strap-grad)" stroke="#4e250f" stroke-width="2" />
      <rect x="-14" y="6" width="28" height="46" rx="4" fill="none" stroke="#f0ddc3" stroke-width="1.8" stroke-dasharray="5 4" opacity="0.9" />
      <!-- Brass D-Ring Loop -->
      <path d="M -20 8 C -20 -15, 20 -15, 20 8 Z" fill="url(#hero-brass-grad)" stroke="#1a110a" stroke-width="2.5" />
      <circle cx="0" cy="30" r="5.5" fill="url(#hero-brass-grad)" stroke="#1a110a" stroke-width="1.5" />
    </g>

    <!-- Right Anchor Root -->
    <g transform="translate(520, 205)">
      <rect x="-20" y="0" width="40" height="58" rx="8" fill="url(#hero-strap-grad)" stroke="#4e250f" stroke-width="2" />
      <rect x="-14" y="6" width="28" height="46" rx="4" fill="none" stroke="#f0ddc3" stroke-width="1.8" stroke-dasharray="5 4" opacity="0.9" />
      <!-- Brass D-Ring Loop -->
      <path d="M -20 8 C -20 -15, 20 -15, 20 8 Z" fill="url(#hero-brass-grad)" stroke="#1a110a" stroke-width="2.5" />
      <circle cx="0" cy="30" r="5.5" fill="url(#hero-brass-grad)" stroke="#1a110a" stroke-width="1.5" />
    </g>

    <!-- Front Rolled Carry Handle (Grand Arched Handle) -->
    <path d="M 280 215 C 280 40, 520 40, 520 215" fill="none" stroke="url(#hero-strap-grad)" stroke-width="28" stroke-linecap="round" />
    <path d="M 280 215 C 280 40, 520 40, 520 215" fill="none" stroke="#f0ddc3" stroke-width="2.6" stroke-dasharray="7 5" stroke-linecap="round" opacity="0.9" />

    <!-- Hanging Bespoke Clochette with 22k Gold Foil Monogram ("AH") -->
    <g transform="translate(260, 215)">
      <!-- Suspension Strap -->
      <path d="M 20 0 L 0 145" stroke="url(#hero-strap-grad)" stroke-width="8" stroke-linecap="round" />
      <circle cx="20" cy="18" r="4.5" fill="url(#hero-brass-grad)" stroke="#1a110a" stroke-width="1.2" />

      <!-- Clochette Bell Body -->
      <g transform="translate(-24, 145)">
        <path d="M 24 0 L 48 36 L 48 125 Q 48 142 32 142 L 16 142 Q 0 142 0 125 L 0 36 Z" fill="url(#hero-strap-grad)" stroke="#4e250f" stroke-width="2.4" />
        <path d="M 24 8 L 42 38 L 42 120 Q 42 134 30 134 L 18 134 Q 6 134 6 120 L 6 38 Z" fill="none" stroke="#f0ddc3" stroke-width="1.8" stroke-dasharray="5 4" opacity="0.9" />
        <circle cx="24" cy="28" r="4" fill="url(#hero-brass-grad)" stroke="#1a110a" stroke-width="1.2" />

        <!-- 22k Gold Foil Monogram Hot-Stamped on Clochette Face -->
        <text x="24" y="92" font-family="'Cinzel', 'Playfair Display', Georgia, serif" font-size="22" font-weight="700" text-anchor="middle" fill="url(#hero-gold-foil)" letter-spacing="3" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.6))">AH</text>
        <line x1="14" y1="102" x2="34" y2="102" stroke="url(#hero-gold-foil)" stroke-width="1.2" opacity="0.8" />
      </g>
    </g>
  </g>
</svg>