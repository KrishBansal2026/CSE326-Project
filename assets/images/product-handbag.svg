<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 650" width="100%" height="100%" id="svg-handbag">
  <defs>
    <!-- Dynamic Leather Gradients (Responsive to Host CSS Custom Properties) -->
    <linearGradient id="hb-leather-grad" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="var(--leather-base-light, #c99f74)" />
      <stop offset="50%" stop-color="var(--leather-base-mid, #bd9367)" />
      <stop offset="100%" stop-color="var(--leather-base-dark, #8f653b)" />
    </linearGradient>

    <linearGradient id="hb-flap-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="var(--leather-base-light, #c99f74)" />
      <stop offset="70%" stop-color="var(--leather-base-mid, #bd9367)" />
      <stop offset="100%" stop-color="var(--leather-base-dark, #8f653b)" />
    </linearGradient>

    <linearGradient id="hb-strap-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="var(--leather-base-dark, #78532d)" />
      <stop offset="50%" stop-color="var(--leather-base-mid, #bd9367)" />
      <stop offset="100%" stop-color="var(--leather-base-dark, #78532d)" />
    </linearGradient>

    <linearGradient id="hb-hw-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="var(--hw-light, #e4cb93)" />
      <stop offset="45%" stop-color="var(--hw-mid, #a88952)" />
      <stop offset="100%" stop-color="var(--hw-dark, #5d461e)" />
    </linearGradient>

    <filter id="hb-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="28" stdDeviation="24" flood-color="#140d0a" flood-opacity="0.38" />
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#140d0a" flood-opacity="0.22" />
    </filter>

    <filter id="hb-flap-shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#100a07" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Ambient Ground Shadow -->
  <ellipse cx="400" cy="580" rx="320" ry="38" fill="#0d0806" opacity="0.36" filter="blur(18px)" />

  <g filter="url(#hb-shadow)">
    <!-- Rear Rolled Handle Arch -->
    <path d="M 310 220 C 310 90, 490 90, 490 220" fill="none" stroke="url(#hb-strap-grad)" stroke-width="20" stroke-linecap="round" opacity="0.75" />

    <!-- Protective Base Brass Studs (Visible at bottom edge) -->
    <g transform="translate(0, 542)">
      <circle cx="230" cy="0" r="7" fill="url(#hb-hw-grad)" stroke="#1a110a" stroke-width="1.5" />
      <circle cx="570" cy="0" r="7" fill="url(#hb-hw-grad)" stroke="#1a110a" stroke-width="1.5" />
      <circle cx="340" cy="2" r="6" fill="url(#hb-hw-grad)" stroke="#1a110a" stroke-width="1" />
      <circle cx="460" cy="2" r="6" fill="url(#hb-hw-grad)" stroke="#1a110a" stroke-width="1" />
    </g>

    <!-- Side D-Rings (For Detachable Shoulder Strap) -->
    <path d="M 180 320 C 158 320 158 360 180 360" fill="none" stroke="url(#hb-hw-grad)" stroke-width="6" stroke-linecap="round" />
    <path d="M 620 320 C 642 320 642 360 620 360" fill="none" stroke="url(#hb-hw-grad)" stroke-width="6" stroke-linecap="round" />

    <!-- Main Structured Handbag Body (Trapezoidal / Tapered Silhouette) -->
    <path d="M 175 510 L 215 220 Q 218 210 230 210 L 570 210 Q 582 210 585 220 L 625 510 Q 630 540 595 540 L 205 540 Q 170 540 175 510 Z" fill="url(#hb-leather-grad)" stroke="var(--leather-base-dark, #78532d)" stroke-width="2.5" />

    <!-- Side Inward Gusset Shadow Creases -->
    <path d="M 215 220 Q 240 370 225 530" fill="none" stroke="var(--leather-base-dark, #5d3d1e)" stroke-width="3" opacity="0.35" />
    <path d="M 585 220 Q 560 370 575 530" fill="none" stroke="var(--leather-base-dark, #5d3d1e)" stroke-width="3" opacity="0.35" />

    <!-- Base Welt Piping Line -->
    <path d="M 176 524 Q 400 532 624 524" fill="none" stroke="var(--leather-base-dark, #78532d)" stroke-width="3" opacity="0.7" />
    <path d="M 185 528 L 615 528" fill="none" stroke="var(--stitch-color, #e0d0b8)" stroke-width="1.8" stroke-dasharray="6 4" opacity="0.8" />

    <!-- Body Perimeter Saddle Stitching -->
    <path d="M 187 505 L 225 225 L 575 225 L 613 505 Q 616 530 588 530 L 212 530 Q 184 530 187 505 Z" fill="none" stroke="var(--stitch-color, #e0d0b8)" stroke-width="2.2" stroke-dasharray="7 5" stroke-linecap="round" opacity="0.85" />

    <!-- Front Sculpted Flap with Beveled Tongue -->
    <g filter="url(#hb-flap-shadow)">
      <path d="M 220 210 L 580 210 L 570 340 Q 565 400 490 400 L 310 400 Q 235 400 230 340 Z" fill="url(#hb-flap-grad)" stroke="var(--leather-base-dark, #78532d)" stroke-width="2.2" />
      
      <!-- Flap Perimeter Saddle Stitching -->
      <path d="M 230 218 L 570 218 L 560 338 Q 555 390 485 390 L 315 390 Q 245 390 240 338 Z" fill="none" stroke="var(--stitch-color, #e0d0b8)" stroke-width="2" stroke-dasharray="6 4" stroke-linecap="round" opacity="0.9" />
    </g>

    <!-- Solid Sand-Cast Brass Turn-Lock Clasp Mechanism -->
    <g transform="translate(400, 365)">
      <!-- Beveled Brass Escutcheon Backing Plate -->
      <rect x="-38" y="-22" width="76" height="44" rx="10" fill="url(#hb-hw-grad)" stroke="#1a110a" stroke-width="2" />
      <rect x="-33" y="-17" width="66" height="34" rx="7" fill="none" stroke="#fff" stroke-opacity="0.25" stroke-width="1" />
      
      <!-- 4 Corner Brass Micro-Rivets -->
      <circle cx="-28" cy="-12" r="2.5" fill="#24160d" />
      <circle cx="28" cy="-12" r="2.5" fill="#24160d" />
      <circle cx="-28" cy="12" r="2.5" fill="#24160d" />
      <circle cx="28" cy="12" r="2.5" fill="#24160d" />

      <!-- Center Brass Lock Ring & Aperture -->
      <ellipse cx="0" cy="0" rx="18" ry="14" fill="#140d08" stroke="url(#hb-hw-grad)" stroke-width="2" />

      <!-- Horizontal Turn-Lock Key / Rotary Stud -->
      <rect x="-18" y="-5.5" width="36" height="11" rx="4" fill="url(#hb-hw-grad)" stroke="#1a110a" stroke-width="1.5" />
      <circle cx="0" cy="0" r="3" fill="#fff" opacity="0.4" />
    </g>

    <!-- Handle Anchors & Solid Brass D-Rings (Front) -->
    <!-- Left Handle Anchor Root -->
    <g transform="translate(305, 195)">
      <rect x="-16" y="0" width="32" height="48" rx="6" fill="url(#hb-strap-grad)" stroke="var(--leather-base-dark, #78532d)" stroke-width="1.8" />
      <rect x="-11" y="5" width="22" height="38" rx="3" fill="none" stroke="var(--stitch-color, #e0d0b8)" stroke-width="1.5" stroke-dasharray="4 3" />
      <!-- Brass D-Ring Loop -->
      <path d="M -16 6 C -16 -12, 16 -12, 16 6 Z" fill="url(#hb-hw-grad)" stroke="#1a110a" stroke-width="2" />
      <circle cx="0" cy="24" r="4.5" fill="url(#hb-hw-grad)" stroke="#1a110a" stroke-width="1.2" />
    </g>

    <!-- Right Handle Anchor Root -->
    <g transform="translate(495, 195)">
      <rect x="-16" y="0" width="32" height="48" rx="6" fill="url(#hb-strap-grad)" stroke="var(--leather-base-dark, #78532d)" stroke-width="1.8" />
      <rect x="-11" y="5" width="22" height="38" rx="3" fill="none" stroke="var(--stitch-color, #e0d0b8)" stroke-width="1.5" stroke-dasharray="4 3" />
      <!-- Brass D-Ring Loop -->
      <path d="M -16 6 C -16 -12, 16 -12, 16 6 Z" fill="url(#hb-hw-grad)" stroke="#1a110a" stroke-width="2" />
      <circle cx="0" cy="24" r="4.5" fill="url(#hb-hw-grad)" stroke="#1a110a" stroke-width="1.2" />
    </g>

    <!-- Front Rolled Carry Handle (Grand Arched Handle) -->
    <path d="M 305 200 C 305 60, 495 60, 495 200" fill="none" stroke="url(#hb-strap-grad)" stroke-width="22" stroke-linecap="round" />
    <path d="M 305 200 C 305 60, 495 60, 495 200" fill="none" stroke="var(--stitch-color, #e0d0b8)" stroke-width="2.2" stroke-dasharray="6 4" stroke-linecap="round" opacity="0.85" />

    <!-- Hanging Bespoke Leather Clochette / Monogram Tag -->
    <g transform="translate(290, 200)">
      <!-- Leather Suspension Strap -->
      <path d="M 15 0 L 0 110" stroke="url(#hb-strap-grad)" stroke-width="7" stroke-linecap="round" />
      <circle cx="15" cy="14" r="3.5" fill="url(#hb-hw-grad)" stroke="#1a110a" stroke-width="1" />
      
      <!-- Clochette Bell Shield Body -->
      <g transform="translate(-18, 110)">
        <path d="M 18 0 L 36 28 L 36 95 Q 36 108 24 108 L 12 108 Q 0 108 0 95 L 0 28 Z" fill="url(#hb-strap-grad)" stroke="var(--leather-base-dark, #78532d)" stroke-width="2" />
        <path d="M 18 6 L 31 30 L 31 92 Q 31 102 22 102 L 14 102 Q 5 102 5 92 L 5 30 Z" fill="none" stroke="var(--stitch-color, #e0d0b8)" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.9" />
        <circle cx="18" cy="22" r="3" fill="url(#hb-hw-grad)" stroke="#1a110a" stroke-width="1" />

        <!-- Monogram Target Spot for Live Dynamic Hot-Stamping -->
        <g id="svg-monogram-target" transform="translate(18, 62)">
          <!-- Dynamic initials or name stamped here -->
        </g>
      </g>
    </g>
  </g>
</svg>