<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="cognac-macro" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#bf7546" />
      <stop offset="30%" stop-color="#a9673f" />
      <stop offset="70%" stop-color="#733d1c" />
      <stop offset="100%" stop-color="#46220e" />
    </linearGradient>
    <radialGradient id="pull-up-glow" cx="45%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#df9a65" stop-opacity="0.65" />
      <stop offset="50%" stop-color="#a9673f" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#46220e" stop-opacity="0" />
    </radialGradient>
    <filter id="anilineDepth">
      <feTurbulence type="fractalNoise" baseFrequency="0.5" numOctaves="3" result="turb" />
      <feColorMatrix type="matrix" values="0.3 0 0 0 0.1  0 0.2 0 0 0.05  0 0 0.1 0 0.02  0 0 0 0.22 0" in="turb" result="grain" />
      <feBlend mode="overlay" in="SourceGraphic" in2="grain" />
    </filter>
  </defs>
  <rect width="600" height="450" fill="url(#cognac-macro)" />
  <rect width="600" height="450" fill="url(#pull-up-glow)" />
  <rect width="600" height="450" fill="none" filter="url(#anilineDepth)" />
  <!-- Fold crease revealing bright pull-up wax burst -->
  <path d="M 0 200 Q 300 240 600 170" stroke="#f2bc88" stroke-width="6" fill="none" opacity="0.6" filter="blur(3px)" />
  <path d="M 0 197 Q 300 237 600 167" stroke="#361706" stroke-width="2" fill="none" opacity="0.5" />
  <g transform="translate(60, 360)" opacity="0.65">
    <text x="0" y="0" font-family="'Cormorant Garamond', Georgia, serif" font-size="16" font-style="italic" fill="#f7e1c8" letter-spacing="1">Tuscan Oil Pull-Up</text>
    <text x="0" y="20" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="9" fill="#f7e1c8" letter-spacing="2">HOT-STUFFED WITH NATURAL WAXES &amp; TALLOW</text>
  </g>
</svg>