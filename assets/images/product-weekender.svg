<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 650" width="100%" height="100%" id="svg-weekender">
  <defs>
    <linearGradient id="wkd-leather-grad" x1="0%" y1="10%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="var(--leather-base-light, #c99f74)" />
      <stop offset="45%" stop-color="var(--leather-base-mid, #bd9367)" />
      <stop offset="100%" stop-color="var(--leather-base-dark, #8f653b)" />
    </linearGradient>

    <linearGradient id="wkd-barrel-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="var(--leather-base-dark, #78532d)" stop-opacity="0.6" />
      <stop offset="15%" stop-color="var(--leather-base-mid, #bd9367)" stop-opacity="0.1" />
      <stop offset="85%" stop-color="var(--leather-base-mid, #bd9367)" stop-opacity="0.1" />
      <stop offset="100%" stop-color="var(--leather-base-dark, #78532d)" stop-opacity="0.6" />
    </linearGradient>

    <linearGradient id="wkd-strap-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="var(--leather-base-dark, #78532d)" />
      <stop offset="50%" stop-color="var(--leather-base-mid, #bd9367)" />
      <stop offset="100%" stop-color="var(--leather-base-dark, #78532d)" />
    </linearGradient>

    <filter id="wkd-shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="30" stdDeviation="26" flood-color="#140d0a" flood-opacity="0.36" />
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#140d0a" flood-opacity="0.22" />
    </filter>

    <linearGradient id="wkd-hw-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="var(--hw-light, #e4cb93)" />
      <stop offset="45%" stop-color="var(--hw-mid, #a88952)" />
      <stop offset="100%" stop-color="var(--hw-dark, #5d461e)" />
    </linearGradient>
  </defs>

  <!-- Ground Shadow -->
  <ellipse cx="400" cy="585" rx="360" ry="45" fill="#0d0806" opacity="0.34" filter="blur(20px)" />

  <g filter="url(#wkd-shadow)">
    <!-- Back Handle Arch -->
    <path d="M 280 230 C 280 90, 520 90, 520 230" fill="none" stroke="url(#wkd-strap-grad)" stroke-width="22" stroke-linecap="round" opacity="0.8" />

    <!-- Main Duffel Body (Curved Barrel Silhouette) -->
    <path d="M 120 490 L 120 300 Q 120 220 210 210 L 590 210 Q 680 220 680 300 L 680 490 Q 680 540 600 540 L 200 540 Q 120 540 120 490 Z" fill="url(#wkd-leather-grad)" stroke="var(--leather-base-dark, #78532d)" stroke-width="2.5" />
    <path d="M 120 490 L 120 300 Q 120 220 210 210 L 590 210 Q 680 220 680 300 L 680 490 Q 680 540 600 540 L 200 540 Q 120 540 120 490 Z" fill="url(#wkd-barrel-grad)" />

    <!-- Top Heavy Zipper Line -->
    <path d="M 180 215 Q 400 205 620 215" fill="none" stroke="url(#wkd-hw-grad)" stroke-width="6" stroke-linecap="round" stroke-dasharray="4 2" />
    <circle cx="210" cy="215" r="7" fill="url(#wkd-hw-grad)" stroke="#1a110a" stroke-width="1.5" />
    <!-- Zipper Pull Tab -->
    <path d="M 210 215 L 195 245 L 205 250 L 220 220 Z" fill="url(#wkd-strap-grad)" stroke="var(--leather-base-dark, #78532d)" stroke-width="1" />

    <!-- End Gusset Oval Stitch Lines -->
    <path d="M 170 230 Q 135 340 135 440 Q 135 510 170 530" fill="none" stroke="var(--stitch-color, #e0d0b8)" stroke-width="2" stroke-dasharray="6 4" />
    <path d="M 630 230 Q 665 340 665 440 Q 665 510 630 530" fill="none" stroke="var(--stitch-color, #e0d0b8)" stroke-width="2" stroke-dasharray="6 4" />

    <!-- Base Reinforcement Trim -->
    <path d="M 120 470 L 680 470 L 680 520 Q 680 540 600 540 L 200 540 Q 120 540 120 520 Z" fill="url(#wkd-strap-grad)" opacity="0.65" stroke="var(--leather-base-dark, #78532d)" stroke-width="1.5" />
    <line x1="120" y1="472" x2="680" y2="472" stroke="var(--stitch-color, #e0d0b8)" stroke-width="2" stroke-dasharray="6 4" />

    <!-- Dual Heavy Reinforcement Straps (Wrapping around duffel) -->
    <!-- Left Wrap Strap -->
    <rect x="250" y="210" width="38" height="330" fill="url(#wkd-strap-grad)" stroke="var(--leather-base-dark, #78532d)" stroke-width="1.5" />
    <line x1="256" y1="210" x2="256" y2="540" stroke="var(--stitch-color, #e0d0b8)" stroke-width="1.8" stroke-dasharray="6 4" />
    <line x1="282" y1="210" x2="282" y2="540" stroke="var(--stitch-color, #e0d0b8)" stroke-width="1.8" stroke-dasharray="6 4" />

    <!-- Right Wrap Strap -->
    <rect x="512" y="210" width="38" height="330" fill="url(#wkd-strap-grad)" stroke="var(--leather-base-dark, #78532d)" stroke-width="1.5" />
    <line x1="518" y1="210" x2="518" y2="540" stroke="var(--stitch-color, #e0d0b8)" stroke-width="1.8" stroke-dasharray="6 4" />
    <line x1="544" y1="210" x2="544" y2="540" stroke="var(--stitch-color, #e0d0b8)" stroke-width="1.8" stroke-dasharray="6 4" />

    <!-- Front Rolled Carry Handle -->
    <path d="M 269 310 C 269 110, 531 110, 531 310" fill="none" stroke="url(#wkd-strap-grad)" stroke-width="24" stroke-linecap="round" />
    <path d="M 269 310 C 269 110, 531 110, 531 310" fill="none" stroke="var(--stitch-color, #e0d0b8)" stroke-width="2" stroke-dasharray="6 4" stroke-linecap="round" />

    <!-- Handle Bases Cross-box Stitching & Heavy Copper/Brass Rivets -->
    <g transform="translate(250, 275)">
      <rect x="0" y="0" width="38" height="50" rx="4" fill="url(#wkd-strap-grad)" stroke="var(--leather-base-dark, #78532d)" stroke-width="1.5" />
      <rect x="4" y="4" width="30" height="42" fill="none" stroke="var(--stitch-color, #e0d0b8)" stroke-width="1.6" stroke-dasharray="4 3" />
      <line x1="4" y1="4" x2="34" y2="46" stroke="var(--stitch-color, #e0d0b8)" stroke-width="1.6" stroke-dasharray="4 3" />
      <line x1="34" y1="4" x2="4" y2="46" stroke="var(--stitch-color, #e0d0b8)" stroke-width="1.6" stroke-dasharray="4 3" />
      <circle cx="19" cy="25" r="5" fill="url(#wkd-hw-grad)" stroke="#1a110a" stroke-width="1" />
    </g>
    <g transform="translate(512, 275)">
      <rect x="0" y="0" width="38" height="50" rx="4" fill="url(#wkd-strap-grad)" stroke="var(--leather-base-dark, #78532d)" stroke-width="1.5" />
      <rect x="4" y="4" width="30" height="42" fill="none" stroke="var(--stitch-color, #e0d0b8)" stroke-width="1.6" stroke-dasharray="4 3" />
      <line x1="4" y1="4" x2="34" y2="46" stroke="var(--stitch-color, #e0d0b8)" stroke-width="1.6" stroke-dasharray="4 3" />
      <line x1="34" y1="4" x2="4" y2="46" stroke="var(--stitch-color, #e0d0b8)" stroke-width="1.6" stroke-dasharray="4 3" />
      <circle cx="19" cy="25" r="5" fill="url(#wkd-hw-grad)" stroke="#1a110a" stroke-width="1" />
    </g>

    <!-- Hanging Bespoke Luggage Tag (The Monogram Canvas Area) -->
    <g transform="translate(350, 240)">
      <!-- Leather Hanging Strap -->
      <path d="M 28 0 L 28 85" stroke="url(#wkd-strap-grad)" stroke-width="8" stroke-linecap="round" />
      <circle cx="28" cy="40" r="4" fill="url(#wkd-hw-grad)" stroke="#1a110a" stroke-width="1" />
      <!-- Luggage Tag Shield Body -->
      <path d="M 0 85 L 56 85 L 56 185 Q 56 195 46 195 L 10 195 Q 0 195 0 185 Z" fill="url(#wkd-strap-grad)" stroke="var(--leather-base-dark, #78532d)" stroke-width="2" />
      <!-- Tag Perimeter Stitching -->
      <path d="M 5 90 L 51 90 L 51 180 Q 51 190 43 190 L 13 190 Q 5 190 5 180 Z" fill="none" stroke="var(--stitch-color, #e0d0b8)" stroke-width="1.6" stroke-dasharray="4 3" />
      <circle cx="28" cy="100" r="4.5" fill="url(#wkd-hw-grad)" stroke="#1a110a" stroke-width="1" />

      <!-- Monogram Target Spot on Tag -->
      <g id="svg-monogram-target" transform="translate(28, 145)">
        <!-- Luggage tag stamping center -->
      </g>
    </g>
  </g>
</svg>