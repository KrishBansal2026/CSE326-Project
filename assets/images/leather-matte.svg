<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="matte-macro" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d2a29" />
      <stop offset="50%" stop-color="#22201e" />
      <stop offset="100%" stop-color="#151413" />
    </linearGradient>
    <pattern id="pebbleSubtle" width="20" height="20" patternUnits="userSpaceOnUse">
      <ellipse cx="6" cy="6" rx="4" ry="3" fill="#32302e" stroke="#161514" stroke-width="0.8" />
      <ellipse cx="16" cy="14" rx="3.5" ry="4" fill="#2c2a28" stroke="#161514" stroke-width="0.8" />
      <ellipse cx="15" cy="5" rx="3" ry="2.5" fill="#242221" stroke="#161514" stroke-width="0.6" />
      <ellipse cx="5" cy="16" rx="3.5" ry="3" fill="#282625" stroke="#161514" stroke-width="0.7" />
    </pattern>
  </defs>
  <rect width="600" height="450" fill="url(#matte-macro)" />
  <rect width="600" height="450" fill="url(#pebbleSubtle)" opacity="0.65" />
  <g transform="translate(60, 360)" opacity="0.7">
    <text x="0" y="0" font-family="'Cormorant Garamond', Georgia, serif" font-size="16" font-style="italic" fill="#d0cbc4" letter-spacing="1">Nordic Matte Pebble</text>
    <text x="0" y="20" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="9" fill="#a8a29b" letter-spacing="2">DRUM-DYED FOR REFINED TEXTURE &amp; SCRATCH RESISTANCE</text>
  </g>
</svg>